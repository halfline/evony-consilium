<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#17221e" />
    <meta
      name="description"
      content="Evony Consilium: an Evony alliance formation and hive planner. Arrange your keeps, choose real castle sprites, and share a plan."
    />
    <title>Evony Consilium · Alliance war room</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/entry.css" />
    <link rel="icon" type="image/svg+xml" href="assets/branding/favicon.svg" />
  </head>
  <body>
    <section id="entry" class="entry">
      <header class="entry-header">
        <a class="brand" href="./"
          ><img
            class="brand-icon"
            src="assets/branding/consilium.png"
            alt=""
            width="64"
            height="64"
          /><span
            >EVONY <b>CONSILIUM</b><small>THE ALLIANCE WAR ROOM</small></span
          ></a
        >
        <details id="account-menu" class="account-menu" hidden>
          <summary aria-label="Google account">
            <img
              id="account-avatar"
              class="account-avatar"
              alt=""
              referrerpolicy="no-referrer"
              hidden
            />
            <span
              id="account-initial"
              class="account-avatar"
              aria-hidden="true"
            ></span>
          </summary>
          <div class="account-popover">
            <strong id="account-name"></strong>
            <span id="account-email"></span>
            <button id="switch-account" type="button">Switch account</button>
            <button id="sign-out" type="button">Sign out</button>
          </div>
        </details>
      </header>
      <div class="entry-card">
        <section id="login-screen">
          <span class="eyebrow">YOUR TEAM’S WAR ROOM</span>
          <h1>Plan together.</h1>
          <p>Sign in to open or create a team.</p>
          <button id="google-login" class="google-sign-in" disabled>
            <img src="assets/branding/google-g.svg" alt="" aria-hidden="true" />
            <span>Sign in with Google</span>
          </button>
          <p id="login-detail">
            Teams live in Google Drive. Your team’s Drive permissions control
            who can open and save them.
          </p>
        </section>
        <section id="projects-screen" hidden>
          <div
            class="tabs project-tabs"
            role="tablist"
            aria-label="Team workflow"
          >
            <button
              id="project-tab-teams"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="project-panel-teams"
              tabindex="-1"
              hidden
            >
              Your teams
            </button>
            <button
              id="project-tab-open"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="project-panel-open"
              class="active"
            >
              Open team
            </button>
            <button
              id="project-tab-create"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="project-panel-create"
              tabindex="-1"
            >
              Create team
            </button>
          </div>
          <section
            id="project-panel-teams"
            role="tabpanel"
            aria-labelledby="project-tab-teams"
            hidden
          >
            <div id="project-list" class="project-list" hidden></div>
          </section>
          <section
            id="project-panel-open"
            role="tabpanel"
            aria-labelledby="project-tab-open"
          >
            <p>Browse teams or paste a shared team link.</p>
            <form id="project-join">
              <label for="project-url">Team link</label>
              <div class="project-location">
                <input
                  id="project-url"
                  type="url"
                  required
                  placeholder="https://drive.google.com/…"
                />
                <button
                  id="project-browse"
                  type="button"
                  aria-label="Browse teams"
                  title="Browse teams"
                >
                  …
                </button>
              </div>
            </form>
            <div class="project-actions">
              <button type="submit" form="project-join" class="primary">
                Open team
              </button>
            </div>
          </section>
          <section
            id="project-panel-create"
            role="tabpanel"
            aria-labelledby="project-tab-create"
            hidden
          >
            <form id="project-create">
              <div id="project-logo" class="project-logo-field"></div>
              <input
                id="project-name"
                aria-label="New team name"
                required
                maxlength="120"
                placeholder="New team name"
              />
            </form>
            <div class="project-actions">
              <button type="submit" form="project-create" class="primary">
                Create team
              </button>
            </div>
          </section>
        </section>
        <div id="entry-progress" class="entry-progress" role="status" hidden>
          <span class="progress-spinner" aria-hidden="true"></span>
          <span id="entry-progress-text"></span>
        </div>
        <p id="entry-error" class="entry-error" role="alert"></p>
        <button id="google-grant-access" type="button" class="primary" hidden>
          Grant access
        </button>
      </div>
      <footer class="entry-footer">
        <a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a>
        · <a href="terms.html" target="_blank" rel="noopener">Terms of use</a>
      </footer>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
